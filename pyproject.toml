[project]
name = "mos-studio"
version = "2.1.0"
description = "Interface para os simuladores SUPREM-III e SUPREM-IV.GS (processo) e MINIMOS 6.1 ou o simulador aberto MOSIM (dispositivo)"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.5", "numpy>=1.24", "scipy>=1.10"]

[project.scripts]
mos-studio = "mos_studio.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mos_studio*"]
