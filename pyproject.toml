[project]
name = "mos-studio"
version = "2.0.0.dev0"
description = "Interface para os simuladores SUPREM-III (processo) e MINIMOS 6.1 (dispositivo)"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
mos-studio = "mos_studio.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mos_studio*"]
